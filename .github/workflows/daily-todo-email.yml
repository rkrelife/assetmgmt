name: Daily To-Do Email

on:
  # Daily schedule disabled at the user's request — no automatic emails.
  # To re-enable, uncomment the schedule block below.
  # schedule:
  #   # 10:30 UTC = 07:30 America/Sao_Paulo (-03:00), no daylight saving in Brazil currently
  #   - cron: "30 10 * * *"
  workflow_dispatch: {}   # can still be triggered manually from the Actions tab

jobs:
  send-todo-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily to-do email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python todo/send_todo.py
